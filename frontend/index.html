<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Threat Guardian 🛡️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: #0d1b2a;
            padding: 20px 40px;
            border-bottom: 2px solid #00ff88;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            font-size: 24px;
            color: #00ff88;
        }

        header p {
            font-size: 13px;
            color: #888;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #0d1b2a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .card .number {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card .label {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
        }

        .card.green .number { color: #00ff88; }
        .card.red .number { color: #ff4444; }
        .card.blue .number { color: #4488ff; }

        .section {
            background: #0d1b2a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 18px;
            color: #00ff88;
            margin-bottom: 25px;
            border-bottom: 1px solid #1a2a3a;
            padding-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            background: #0a0e1a;
            border: 1px solid #1a2a3a;
            border-radius: 8px;
            padding: 10px 12px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .btn {
            background: #00ff88;
            color: #0a0e1a;
            border: none;
            border-radius: 8px;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover { background: #00cc66; }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .result.normal {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            color: #00ff88;
        }

        .result.threat {
            background: rgba(255, 68, 68, 0.1);
            border: 2px solid #ff4444;
            color: #ff4444;
        }

        .history {
            width: 100%;
            border-collapse: collapse;
        }

        .history th {
            text-align: left;
            padding: 12px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            border-bottom: 1px solid #1a2a3a;
        }

        .history td {
            padding: 12px;
            font-size: 14px;
            border-bottom: 1px solid #0a0e1a;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.normal { background: rgba(0,255,136,0.15); color: #00ff88; }
        .badge.threat { background: rgba(255,68,68,0.15); color: #ff4444; }

        .loading { display: none; color: #888; text-align: center; padding: 15px; }
    </style>
</head>
<body>

<header>
    <div>
        <h1>🛡️ AI Threat Guardian</h1>
        <p>Système de Détection d'Intrusion — Machine Learning</p>
    </div>
</header>

<div class="container">

    <!-- Stats -->
    <div class="cards">
        <div class="card blue">
            <div class="number" id="total">0</div>
            <div class="label">Total Analyses</div>
        </div>
        <div class="card green">
            <div class="number" id="normaux">0</div>
            <div class="label">Trafic Normal</div>
        </div>
        <div class="card red">
            <div class="number" id="attaques">0</div>
            <div class="label">Attaques Détectées</div>
        </div>
    </div>

    <!-- Formulaire -->
    <div class="section">
        <h2>🔍 Analyser une Connexion</h2>
        <div class="form-grid">
            <div class="form-group">
                <label>Duration</label>
                <input type="number" id="duration" value="0">
            </div>
            <div class="form-group">
                <label>Protocol Type</label>
                <input type="number" id="protocol_type" value="2">
            </div>
            <div class="form-group">
                <label>Service</label>
                <input type="number" id="service" value="20">
            </div>
            <div class="form-group">
                <label>Flag</label>
                <input type="number" id="flag" value="9">
            </div>
            <div class="form-group">
                <label>Src Bytes</label>
                <input type="number" id="src_bytes" value="491">
            </div>
            <div class="form-group">
                <label>Dst Bytes</label>
                <input type="number" id="dst_bytes" value="0">
            </div>
            <div class="form-group">
                <label>Count</label>
                <input type="number" id="count" value="2">
            </div>
            <div class="form-group">
                <label>Srv Count</label>
                <input type="number" id="srv_count" value="2">
            </div>
            <div class="form-group">
                <label>Serror Rate</label>
                <input type="number" id="serror_rate" value="0.0" step="0.1">
            </div>
            <div class="form-group">
                <label>Rerror Rate</label>
                <input type="number" id="rerror_rate" value="0.0" step="0.1">
            </div>
            <div class="form-group">
                <label>Same Srv Rate</label>
                <input type="number" id="same_srv_rate" value="1.0" step="0.1">
            </div>
            <div class="form-group">
                <label>Dst Host Count</label>
                <input type="number" id="dst_host_count" value="150">
            </div>
            <div class="form-group">
                <label>Dst Host Srv Count</label>
                <input type="number" id="dst_host_srv_count" value="25">
            </div>
        </div>

        <button class="btn" onclick="analyser()">🔍 Analyser la Connexion</button>
        <div class="loading" id="loading">⏳ Analyse en cours...</div>
        <div class="result" id="result"></div>
    </div>

    <!-- Historique -->
    <div class="section">
        <h2>📋 Historique des Analyses</h2>
        <table class="history">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Heure</th>
                    <th>Src Bytes</th>
                    <th>Count</th>
                    <th>Score</th>
                    <th>Résultat</th>
                </tr>
            </thead>
            <tbody id="historique"></tbody>
        </table>
    </div>

</div>

<script>
    let total = 0, normaux = 0, attaques = 0;

    async function analyser() {
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        loading.style.display = 'block';
        result.style.display = 'none';

        const data = {
            duration: parseFloat(document.getElementById('duration').value),
            protocol_type: parseFloat(document.getElementById('protocol_type').value),
            service: parseFloat(document.getElementById('service').value),
            flag: parseFloat(document.getElementById('flag').value),
            src_bytes: parseFloat(document.getElementById('src_bytes').value),
            dst_bytes: parseFloat(document.getElementById('dst_bytes').value),
            count: parseFloat(document.getElementById('count').value),
            srv_count: parseFloat(document.getElementById('srv_count').value),
            serror_rate: parseFloat(document.getElementById('serror_rate').value),
            rerror_rate: parseFloat(document.getElementById('rerror_rate').value),
            same_srv_rate: parseFloat(document.getElementById('same_srv_rate').value),
            dst_host_count: parseFloat(document.getElementById('dst_host_count').value),
            dst_host_srv_count: parseFloat(document.getElementById('dst_host_srv_count').value)
        };

        try {
            const response = await fetch('http://127.0.0.1:8000/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const res = await response.json();

            loading.style.display = 'none';
            result.style.display = 'block';

            if (res.is_threat) {
                result.className = 'result threat';
                result.innerHTML = '🚨 ATTAQUE DÉTECTÉE ! Score: ' + res.score.toFixed(3);
                attaques++;
            } else {
                result.className = 'result normal';
                result.innerHTML = '✅ Trafic Normal — Score: ' + res.score.toFixed(3);
                normaux++;
            }

            total++;
            document.getElementById('total').textContent = total;
            document.getElementById('normaux').textContent = normaux;
            document.getElementById('attaques').textContent = attaques;

            // Ajouter à l'historique
            const tbody = document.getElementById('historique');
            const row = document.createElement('tr');
            const now = new Date().toLocaleTimeString();
            row.innerHTML = `
                <td>${total}</td>
                <td>${now}</td>
                <td>${data.src_bytes}</td>
                <td>${data.count}</td>
                <td>${res.score.toFixed(3)}</td>
                <td><span class="badge ${res.is_threat ? 'threat' : 'normal'}">
                    ${res.is_threat ? 'ATTAQUE' : 'Normal'}
                </span></td>
            `;
            tbody.insertBefore(row, tbody.firstChild);

        } catch(e) {
            loading.style.display = 'none';
            result.style.display = 'block';
            result.className = 'result threat';
            result.innerHTML = '❌ Erreur : Vérifie que l\'API tourne sur le port 8000';
        }
    }
</script>

</body>
</html>
