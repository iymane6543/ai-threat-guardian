<script>
    async function chargerStats() {
        const res = await fetch('http://127.0.0.1:8000/stats');
        const stats = await res.json();
        document.getElementById('total').textContent = stats.total;
        document.getElementById('normaux').textContent = stats.normaux;
        document.getElementById('attaques').textContent = stats.attaques;
    }

    async function chargerHistorique() {
        const res = await fetch('http://127.0.0.1:8000/history');
        const rows = await res.json();
        const tbody = document.getElementById('historique');
        tbody.innerHTML = '';
        rows.forEach(r => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${r.id}</td>
                <td>${r.timestamp}</td>
                <td>${r.src_bytes}</td>
                <td>${r.count}</td>
                <td>${r.score.toFixed(3)}</td>
                <td><span class="badge ${r.is_threat ? 'threat' : 'normal'}">
                    ${r.is_threat ? 'ATTAQUE' : 'Normal'}
                </span></td>
            `;
            tbody.appendChild(row);
        });
    }

    async function analyser() {
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        loading.style.display = 'block';
        result.style.display = 'none';

        const data = {
            duration: parseFloat(document.getElementById('duration').value),
            protocol_type: parseFloat(document.getElementById('protocol_type').value),
            service: parseFloat(document.getElementById('service').value),
            flag: parseFloat(document.getElementById('flag').value),
            src_bytes: parseFloat(document.getElementById('src_bytes').value),
            dst_bytes: parseFloat(document.getElementById('dst_bytes').value),
            count: parseFloat(document.getElementById('count').value),
            srv_count: parseFloat(document.getElementById('srv_count').value),
            serror_rate: parseFloat(document.getElementById('serror_rate').value),
            rerror_rate: parseFloat(document.getElementById('rerror_rate').value),
            same_srv_rate: parseFloat(document.getElementById('same_srv_rate').value),
            dst_host_count: parseFloat(document.getElementById('dst_host_count').value),
            dst_host_srv_count: parseFloat(document.getElementById('dst_host_srv_count').value)
        };

        try {
            const response = await fetch('http://127.0.0.1:8000/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const res = await response.json();

            loading.style.display = 'none';
            result.style.display = 'block';

            if (res.is_threat) {
                result.className = 'result threat';
                result.innerHTML = '🚨 ATTAQUE DÉTECTÉE ! Score: ' + res.score.toFixed(3);
            } else {
                result.className = 'result normal';
                result.innerHTML = '✅ Trafic Normal — Score: ' + res.score.toFixed(3);
            }

            chargerStats();
            chargerHistorique();

        } catch(e) {
            loading.style.display = 'none';
            result.style.display = 'block';
            result.className = 'result threat';
            result.innerHTML = '❌ Erreur : Vérifie que l\'API tourne sur le port 8000';
        }
    }

    // Charger au démarrage
    chargerStats();
    chargerHistorique();
</script>
`
